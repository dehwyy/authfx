version: "2"

linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - ineffassign
    - unused
    - errorlint
    - bodyclose
    - rowserrcheck
    - sqlclosecheck
    - contextcheck
    - nilerr
    - gosec
    - predeclared
    - copyloopvar
    - intrange

formatters:
  enable:
    - gofumpt
    - gci
  settings:
    gci:
      sections:
        - standard
        - prefix(github.com/dehwyy/authfx)
        - default
